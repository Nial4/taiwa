[project]
name = "taiwa-relay"
version = "0.1.0"
description = "LAN relay between the Taiwa Android TV panel and ChatGPT (Sign in with ChatGPT), with local Whisper speech-to-text"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "httpx>=0.27",
    "pyjwt[crypto]>=2.9",
    "opencc-python-reimplemented>=0.1.7",
    # macOS publishes through dns-sd and Linux prefers Avahi when it is installed.
    "zeroconf>=0.140; sys_platform != 'darwin'",
]

[project.scripts]
taiwa-relay = "taiwa_relay.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["taiwa_relay"]
